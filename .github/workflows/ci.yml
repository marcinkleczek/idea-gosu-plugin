name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JDK 21 / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test and package plugin
        run: xvfb-run --auto-servernum ./gradlew --no-daemon --stacktrace test buildPlugin verifyPluginStructure
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gosu-gsp-support
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14
